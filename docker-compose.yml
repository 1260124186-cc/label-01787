version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: xiaoan-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: xiaoan_bookstore
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/init.sql
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --init-connect='SET NAMES utf8mb4'
      --default-time-zone='+08:00'
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123456"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - xiaoan-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: xiaoan-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/xiaoan_bookstore?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&autoReconnect=true&failOverReadOnly=false&maxReconnects=10
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123456
      UPLOAD_PATH: /data/uploads
    volumes:
      - upload-data:/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - xiaoan-net

  frontend-admin:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
    container_name: xiaoan-frontend-admin
    restart: always
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - xiaoan-net

volumes:
  mysql-data:
  upload-data:

networks:
  xiaoan-net:
    driver: bridge
